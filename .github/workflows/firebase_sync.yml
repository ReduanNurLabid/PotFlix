name: PotFlix Firebase Incremental Sync

on:
  # schedule:
  #   # Disabled automatic cron to prevent failure emails (sync_to_firebase.py requires local BDIX connectivity)
  #   - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Synced URLs State
        uses: actions/cache@v4
        with:
          path: firebase_cache.json
          key: firebase-sync-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            firebase-sync-cache-${{ runner.os }}-

      - name: Run Incremental Firebase Sync
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          python sync_to_firebase.py
