name: Build & Publish Release

on:
  push:
    tags:
      - 'Android.v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. Android.v2.1.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APKs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Configure Gradle for CI Environment
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true

      - name: Build Release APKs (Split architectures + Universal)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Generated APK Outputs
        run: |
          echo "=== Generated APK Files ==="
          ls -lh app/build/outputs/apk/release/
          
          if [ ! -f "app/build/outputs/apk/release/potflix-arm64-v8a-release.apk" ]; then
            echo "Error: potflix-arm64-v8a-release.apk missing!"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            app/build/outputs/apk/release/potflix-arm64-v8a-release.apk
            app/build/outputs/apk/release/potflix-armeabi-v7a-release.apk
            app/build/outputs/apk/release/potflix-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
